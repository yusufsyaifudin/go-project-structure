version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - godot

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    godot:
      scope: declarations
      capital: false
      exclude:
        # swaggo annotation lines cannot end with a period.
        - "^// @"

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      - path: "cmd/"
        linters:
          - revive
    # docs/swagger/ is gitignored and regenerated by `make swagger`; skip all linting.
    paths:
      - docs/swagger/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yusufsyaifudin/go-project-structure
  exclusions:
    # docs/swagger/ is gitignored and regenerated by `make swagger`; skip all formatting checks.
    paths:
      - docs/swagger/
