name: Build and Publish

on:
  # run it on push to the default repository branch
  push:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: |
          go test -v -race \
            -coverprofile coverage.cov \
            -coverpkg=./internal/gateway/...,./internal/pkg/...,./internal/service/...,./pkg/...,./transport/... \
            ./...
          go tool cover -func coverage.cov

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --verbose --timeout=30m ./...

  # Build and publish server and CLI images.
  build-and-push-docker-images:
    name: Build Docker images and push to GitHub Container Registry
    # run only when test and lint pass
    needs: [test, lint]
    runs-on: ubuntu-26.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v2

      - name: Available platforms QEMU
        run: echo ${{ steps.qemu.outputs.platforms }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Available platforms Buildx
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v3
        with:
          context: .
          target: server
          tags: |
            ghcr.io/yusufsyaifudin/go-project-structure:latest-server
            ghcr.io/yusufsyaifudin/go-project-structure:${{ steps.sha.outputs.short }}-server
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Build and push CLI image
        uses: docker/build-push-action@v3
        with:
          context: .
          target: cli
          tags: |
            ghcr.io/yusufsyaifudin/go-project-structure:latest-cli
            ghcr.io/yusufsyaifudin/go-project-structure:${{ steps.sha.outputs.short }}-cli
          platforms: linux/amd64,linux/arm64
          push: true
